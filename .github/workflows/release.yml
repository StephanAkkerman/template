# Creates a GitHub release with generated notes when a `v*` tag is pushed.
# Add a PyPI publish step here (trusted publishing) for libraries.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
